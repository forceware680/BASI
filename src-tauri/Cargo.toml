[package]
name = "sim-ba-koreksi"
version = "1.0.6"
description = "SIM-BA Koreksi BMD - Desktop Tracking Ekspedisi & Tanda Terima Tunggal"
authors = ["Forceware"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "derive", "macros", "migrate"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "stream", "rustls-tls"] }
bcrypt = "0.16"

[profile.dev]
opt-level = 1
lto = "off"
