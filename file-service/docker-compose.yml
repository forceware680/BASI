services:
  file-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simbasi-file-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - UPLOAD_DIR=/app/uploads
      - API_KEY=simbasi_secret_key_bpkad_magelang
    volumes:
      # Persistent storage mount ke host VPS
      - /data/simbasi/bukti:/app/uploads
